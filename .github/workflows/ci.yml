name: Monorepo CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gmail:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ativos/gmail-telegram
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare configuration
        run: cp config.example.py config.py
      - name: Compile
        run: python -m py_compile *.py
      - name: Test
        run: python -m unittest discover -s tests -v

  estudos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ativos/estudos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare configuration
        run: cp config.example.py config.py
      - name: Compile
        run: python -m py_compile main.py ia.py pdf_utils.py config.py
      - name: Test
        run: python -m unittest discover -s tests -v

  kali-bunker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ativos/kali-bunker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile
        run: python -m py_compile *.py
      - name: Test
        run: python -m pytest -q


  deploy-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate deploy scripts
        run: |
          bash -n deploy/server/preflight.sh
          bash -n deploy/server/install.sh
          bash -n deploy/server/activate.sh
          bash -n deploy/server/verify.sh
          bash -n deploy/server/rollback.sh
      - name: Run read-only preflight
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: ./deploy/server/preflight.sh
